name: Release

# One version, one tag (fundamentals plan §6e): pushing a tag v<version>, equal to the <Version> of every project,
# publishes everything of that version:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
#   1. version   the tag matches every project's <Version>, and CHANGELOG.md has a section for it, or nothing runs
#   2. test      the whole suite on Linux and Windows, unit and integration, as unit-tests.yml runs it
#   3. binaries  per RID (linux-x64, win-x64): Native AOT publish of axiom-meshd and axiom-mesh, the smoke
#                (Scripts/aot-smoke.*, run by Scripts/package.*), one zip with both executables, LICENSE and README.txt
#   4. nuget     the seven libraries (Model, Protocol, Local, Discovery, Core, Service, Testing) and the dotnet tool axiom-mesh,
#                pushed to nuget.org with Trusted Publishing: no API key secret, a short-lived key from an OIDC token
#                (nuget.org needs a Trusted Publishing policy for this repository and this workflow file)
#   5. release   the GitHub Release v<version>: both zips, SHA256SUMS over them, and CHANGELOG.md's section as notes
#
# The daemon is never a NuGet package; it ships in the zips only. Nothing is published unless every earlier step passed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The tag matches every project and the changelog
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<suffix>]"
            exit 1
          fi
          wrong=0
          for project in $(git ls-files '*.csproj' | grep -v -E '^(UnitTests|IntegrationTests|Benchmarks|Conformance|Spikes)/'); do
            declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n 1)
            if [[ -n "$declared" && "$declared" != "$version" ]]; then
              echo "::error file=$project::<Version>$declared</Version> differs from the tag $GITHUB_REF_NAME"
              wrong=1
            fi
          done
          grep -q "^## $version\$" CHANGELOG.md || { echo "::error file=CHANGELOG.md::No section '## $version'"; wrong=1; }
          [[ $wrong -eq 0 ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Axiom.Mesh.slnx --configuration Release

      - name: Test
        run: dotnet test Axiom.Mesh.slnx --configuration Release --no-build --logger "trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  binaries:
    needs: [ version, test ]
    name: binaries (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev zip

      - name: Publish, smoke and zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh Scripts/package.sh "${{ matrix.rid }}" "$RUNNER_TEMP/dist" "${{ needs.version.outputs.version }}"

      - name: Publish, smoke and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/package.ps1 -Runtime "${{ matrix.rid }}" -Output "$env:RUNNER_TEMP\dist" -Version "${{ needs.version.outputs.version }}"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/dist/axiom-mesh-*.zip
            ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error

  nuget:
    needs: [ version, test, binaries ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            Axiom.Mesh.Model/Axiom.Mesh.Model.csproj \
            Axiom.Mesh.Protocol/Axiom.Mesh.Protocol.csproj \
            Axiom.Mesh.Local/Axiom.Mesh.Local.csproj \
            Axiom.Mesh.Discovery/Axiom.Mesh.Discovery.csproj \
            Axiom.Mesh.Core/Axiom.Mesh.Core.csproj \
            Axiom.Mesh.Service/Axiom.Mesh.Service.csproj \
            Axiom.Mesh.Testing/Axiom.Mesh.Testing.csproj \
            Apps/Axiom.Mesh.Cli/Axiom.Mesh.Cli.csproj; do
            dotnet pack "$project" --configuration Release -p:ContinuousIntegrationBuild=true --output out
          done
          ls -l out
          test "$(ls out/*.nupkg | wc -l)" -eq 8

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'DeadMoon0' }}

      # Dependencies first, so no package is ever on nuget.org before what it needs; a re-run skips what is there.
      - name: Push
        shell: bash
        run: |
          set -euo pipefail
          for id in Model Protocol Local Discovery Core Service Testing Cli; do
            dotnet nuget push "out/Axiom.Mesh.$id.${{ needs.version.outputs.version }}.nupkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  release:
    needs: [ version, binaries, nuget ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the zips
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: zips

      - name: SHA256SUMS and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir assets
          find zips -name '*.zip' -exec cp {} assets/ \;
          (cd assets && sha256sum axiom-mesh-*.zip > SHA256SUMS)
          for part in zips/*/SHA256SUMS; do
            while read -r hash name; do
              grep -q "^$hash  $name\$" assets/SHA256SUMS || { echo "::error::$name changed between its job and this one"; exit 1; }
            done < "$part"
          done
          cat assets/SHA256SUMS
          version="${{ needs.version.outputs.version }}"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Axiom.Mesh ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
