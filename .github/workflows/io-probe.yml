name: IO probe

# Temporary (STRUCTURAL-DEBT.md 88): measures what a flushed small-file write costs on the hosted runners' drives, to decide
# where the integration suite's stores should live. Removed once the decision is taken.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Write the probe
        shell: bash
        run: |
          mkdir -p probe && cd probe
          cat > probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
          </Project>
          EOF
          cat > Program.cs <<'EOF'
          using System.Diagnostics;

          foreach (string root in args)
          {
              string dir = Path.Combine(root, "axiom-io-probe-" + Guid.NewGuid().ToString("N")[..8]);
              Directory.CreateDirectory(dir);
              Console.WriteLine($"== {root} ({new DriveInfo(Path.GetPathRoot(dir)!).DriveFormat})");
              Measure("200 x 4 KiB, flushed, then renamed", () => Write(dir, 200, 4096, flush: true));
              Measure("200 x 4 KiB, not flushed, then renamed", () => Write(dir, 200, 4096, flush: false));
              Measure("20 x 1 MiB, flushed, then renamed", () => Write(dir, 20, 1 << 20, flush: true));
              Measure("200 x 4 KiB, flushed, into 200 fresh subdirectories", () => Write(dir, 200, 4096, flush: true, subdirectories: true));
              Directory.Delete(dir, recursive: true);
          }

          static void Measure(string what, Action action)
          {
              Stopwatch watch = Stopwatch.StartNew();
              action();
              Console.WriteLine($"  {what}: {watch.ElapsedMilliseconds} ms");
          }

          static void Write(string dir, int count, int size, bool flush, bool subdirectories = false)
          {
              byte[] bytes = new byte[size];
              Random.Shared.NextBytes(bytes);
              for (int i = 0; i < count; i++)
              {
                  string where = subdirectories ? Path.Combine(dir, $"d{i:D4}") : dir;
                  if (subdirectories)
                      Directory.CreateDirectory(where);
                  string partial = Path.Combine(where, $".partial-{i}-{flush}-{size}");
                  using (var stream = new FileStream(partial, FileMode.CreateNew, FileAccess.Write, FileShare.None, 1 << 16))
                  {
                      stream.Write(bytes);
                      if (flush)
                          stream.Flush(flushToDisk: true);
                  }

                  File.Move(partial, Path.Combine(where, $"f-{i}-{flush}-{size}"));
              }
          }
          EOF

      - name: Run the probe (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: dotnet run --project probe -c Release -- "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp

      - name: Run the probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\probe | Out-Null
          dotnet run --project probe -c Release -- "$env:RUNNER_TEMP" "$env:GITHUB_WORKSPACE" "C:\probe" "$env:TEMP"
